# Builds the documentation site on every push to main, and publishes it to
# GitHub Pages once the repository is public.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w @temporeum/timeline-docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

  # A private repository's site would still be public, so the site is
  # published only once the repository is: until then the build job checks
  # that it builds, and nothing is deployed.
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
