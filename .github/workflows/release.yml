# Publishes the six packages to npm with provenance, the engine first. Started by hand only
# (Actions → Release → Run workflow) by a maintainer with release rights, from main, on a
# commit CI passed; see RELEASING.md.
#
# Four jobs, each with only the rights it needs: the guard reads; the build installs, tests
# and packs with read-only rights and no secret, and hands the tarballs on; the publish job
# installs nothing and runs no package script — it publishes the tarballs through npm's
# trusted publishing (OIDC, no token); the tag job alone may write to the repository.
name: Release

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag: latest for a release, next for a pre-release"
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A branch name is text anyone who may dispatch the workflow chooses: it
      # reaches the shell through the environment, never spliced into the script.
      - name: from main only
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases are made from main, not $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --event push --json conclusion --jq '.[0].conclusion')
          [ "$conclusion" = "success" ] || { echo "::error::CI on ${{ github.sha }} is '${conclusion:-not run}', not success"; exit 1; }
      - name: version
        id: version
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) [ "$DIST_TAG" = "next" ] || { echo "::error::$version is a pre-release: publish it under next"; exit 1; } ;;
            *)   [ "$DIST_TAG" = "latest" ] || { echo "::error::$version is a release: publish it under latest"; exit 1; } ;;
          esac

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: build and test
        run: |
          node scripts/sdk_changelog.mjs --check
          npm run build
          npm test
          npm run deps
          node scripts/sdk_check_exports.mjs
          node scripts/sdk_check_pack.mjs ${{ inputs.dist-tag == 'next' && '--allow-prerelease' || '' }}
      - name: pack
        run: |
          mkdir -p tarballs
          for pkg in packages/core packages/web-component packages/react packages/vue packages/svelte packages/angular; do
            (cd "$pkg" && npm pack --ignore-scripts --pack-destination ../../tarballs)
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs/*.tgz
          if-no-files-found: error

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs
      # In dependency order. A version already on npm is skipped, so a run that
      # stopped half-way can be started again. The ./ matters: npm reads
      # "tarballs/x.tgz" as the GitHub repository tarballs/x.tgz.
      - name: publish
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          # All six first: a missing tarball stops the run before anything is on npm.
          for pkg in packages/core packages/web-component packages/react packages/vue packages/svelte packages/angular; do
            short=$(basename "$pkg" | sed 's/^web-component$/element/')
            [ -f "./tarballs/temporeum-timeline-$short-$VERSION.tgz" ] || { echo "::error::tarballs/temporeum-timeline-$short-$VERSION.tgz is missing"; exit 1; }
          done
          for pkg in packages/core packages/web-component packages/react packages/vue packages/svelte packages/angular; do
            short=$(basename "$pkg" | sed 's/^web-component$/element/')
            if npm view "@temporeum/timeline-$short@$VERSION" version >/dev/null 2>&1; then
              echo "@temporeum/timeline-$short@$VERSION is already on npm — skipped"
              continue
            fi
            npm publish "./tarballs/temporeum-timeline-$short-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
          done

  tag:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the v<version> tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged"
          else
            # Annotated: it says who tagged and when, as a release tag should.
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi
