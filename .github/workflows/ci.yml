# Every push and pull request: the core's suites on the lowest supported Node and
# the current LTS lines, the size budgets, the zero-dependency rule, every package's
# tests, the browser suites in Chromium, and what npm would receive.
#
# Performance is NOT measured here: a shared CI runner's timing is not a
# yardstick. The benchmark (packages/docs/bench) runs on a quiet machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run; on main every commit is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node the packages support (engines), and the current LTS lines.
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The core's suite exports SVG and PNG through a real Chromium.
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # The framework packages type-check against the element's built types, and the element against the engine's.
      - run: npm run build -w packages/core -w packages/web-component
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint
      # The core's whole suite, once, with the per-file coverage threshold.
      - name: core suite and coverage
        run: npm run test:coverage -w packages/core
      - name: the built core without a DOM
        run: node scripts/sdk_check_nodom.mjs
      - name: both orientations
        run: npm run test:orientation -w packages/core
      - name: property suites
        run: npm run test:property -w packages/core
      - name: visual regression
        run: npm run test:visual -w packages/core
      - name: right to left, and the dependency arrows' routing
        run: |
          npm run test:rtl -w packages/core
          npm run test:dep-routing -w packages/core
      - name: size budgets
        run: npm run size -w packages/core
      - name: tree-shaking and entry-point isolation
        run: npm run test:treeshake -w packages/core
      - name: zero runtime dependencies
        run: npm run deps

  browser:
    name: browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # Every workspace's own tests — the element, the four components and the
      # docs site's builder — and a workspace without a test script fails.
      - name: every package's tests
        run: npm run test:all
      - name: every documented example
        run: npm run test:examples -w @temporeum/timeline-docs
      - name: accessibility (axe, WCAG 2.2 AA)
        run: npm run test:a11y -w @temporeum/timeline-docs
      - name: server rendering and hydration
        run: npm run test:ssr -w @temporeum/timeline-docs
      - name: touch
        run: npm run test:e2e:touch -w @temporeum/timeline-docs
      - name: the vis-timeline migration guide
        run: npm run test:migration -w @temporeum/timeline-docs
      - name: exports map, from the packed tarballs
        run: node scripts/sdk_check_exports.mjs
      - name: every public name documented, no positional booleans
        run: node scripts/sdk_check_api_docs.mjs
      - name: no core option dropped silently, no gesture-only capability
        run: |
          npm run test:passthrough -w @temporeum/timeline-element
          npm run test:gesture-parity -w @temporeum/timeline-element
      - name: the changelogs have an entry for the version
        run: node scripts/sdk_changelog.mjs --check-entry
      - name: what npm would receive (dry run)
        run: node scripts/sdk_check_pack.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
