# Every push and pull request: the unit and property suites, the size budgets,
# the zero-dependency rule, and the browser suites in Chromium.
#
# Performance is NOT measured here: a shared CI runner's timing is not a
# yardstick. The benchmark (packages/docs/bench) runs on a quiet machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The core's suite exports SVG and PNG through a real Chromium.
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # The framework packages type-check against the element's built types, and the element against the engine's.
      - run: npm run build -w packages/core -w packages/web-component
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint
      - run: npm run test -w packages/core
      - name: core without a DOM
        run: npm run test:node -w packages/core
      - name: both orientations
        run: npm run test:orientation -w packages/core
      - name: property suites
        run: npm run test:property -w packages/core
      - name: visual regression
        run: npm run test:visual -w packages/core
      - name: coverage
        run: npm run test:coverage -w packages/core
      - name: size budgets
        run: npm run size -w packages/core
      - name: tree-shaking and entry-point isolation
        run: npm run test:treeshake -w packages/core
      - name: zero runtime dependencies
        run: npm run deps

  browser:
    name: browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: element and the framework packages
        run: |
          npm run test -w @temporeum/timeline-element
          npm run test -w @temporeum/timeline-react
          npm run test -w @temporeum/timeline-vue
          npm run test -w @temporeum/timeline-svelte
          npm run test -w @temporeum/timeline-angular
      - name: every documented example
        run: npm run test:examples -w @temporeum/timeline-docs
      - name: accessibility (axe, WCAG 2.2 AA)
        run: npm run test:a11y -w @temporeum/timeline-docs
      - name: server rendering and hydration
        run: npm run test:ssr -w @temporeum/timeline-docs
      - name: touch
        run: npm run test:e2e:touch -w @temporeum/timeline-docs
      - name: the vis-timeline migration guide
        run: npm run test:migration -w @temporeum/timeline-docs
      - name: exports map, from the packed tarballs
        run: node scripts/sdk_check_exports.mjs
      - name: every public name documented, no positional booleans
        run: node scripts/sdk_check_api_docs.mjs
      - name: no core option dropped silently, no gesture-only capability
        run: |
          npm run test:passthrough -w @temporeum/timeline-element
          npm run test:gesture-parity -w @temporeum/timeline-element

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
