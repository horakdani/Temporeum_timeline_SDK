# Every push and pull request: the core's suites, the server rendering of every
# package and the exports map on the lowest supported Node and the current LTS
# lines, the size budgets, the zero-dependency rule, every package's tests, the
# browser suites in Chromium, and what npm would receive.
#
# Performance is NOT measured here: a shared CI runner's timing is not a
# yardstick. The benchmark (packages/docs/bench) runs on a quiet machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push replaces a pull request's run. On main every commit is checked,
  # so each has a group of its own: within one group GitHub drops a waiting run
  # when a newer one comes, cancel-in-progress or not, and the release workflow
  # refuses a commit without a passing run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node the packages support (engines), and the current LTS lines.
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The core's suite exports SVG and PNG through a real Chromium.
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # The framework packages type-check against the element's built types, and the element against the engine's.
      - run: npm run build -w packages/core -w packages/web-component
      - run: npm run typecheck --workspaces --if-present
      # ESLint and size-limit admit Node 22.13 and 22.19 at the lowest, so the
      # lint and the core's size budget run on the lines they support; what
      # 22.12 measures is the packages, not the tools. pdfjs-dist (the PDF
      # tests' reader, a dev dependency) says 22.13 as well, and runs on 22.12
      # in the core suite through its legacy build's polyfills (Y32).
      - if: matrix.node != '22.12.0'
        run: npm run lint
      # The core's whole suite, once, with the per-file coverage threshold.
      - name: core suite and coverage
        run: npm run test:coverage -w packages/core
      - name: the built core without a DOM
        run: node scripts/sdk_check_nodom.mjs
      - name: both orientations
        run: npm run test:orientation -w packages/core
      - name: property suites
        run: npm run test:property -w packages/core
      - name: visual regression
        run: npm run test:visual -w packages/core
      - name: right to left, and the dependency arrows' routing
        run: |
          npm run test:rtl -w packages/core
          npm run test:dep-routing -w packages/core
      - name: size budgets
        if: matrix.node != '22.12.0'
        run: npm run size -w packages/core
      - name: tree-shaking and entry-point isolation
        run: npm run test:treeshake -w packages/core
      - name: zero runtime dependencies
        run: npm run deps
      # The element's and the four components' node suites (server rendering),
      # and the exports map installed from the packed tarballs in a clean
      # directory, on every Node the engines field admits — not only on 24.
      - name: server rendering and the exports map, on this Node
        run: |
          npm run build -w packages/react -w packages/vue -w packages/svelte -w packages/angular
          for pkg in web-component react vue svelte angular; do
            (cd "packages/$pkg" && npx vitest run --project node) || exit 1
          done
          node scripts/sdk_check_exports.mjs
      - name: the element's and the components' size budgets
        run: node scripts/sdk_size_packages.mjs

  browser:
    name: browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # Every workspace's own tests — the element, the four components and the
      # docs site's builder — and a workspace without a test script fails.
      - name: every package's tests
        run: npm run test:all
      - name: every documented example
        run: npm run test:examples -w @temporeum/timeline-docs
      - name: accessibility (axe, WCAG 2.2 AA)
        run: npm run test:a11y -w @temporeum/timeline-docs
      - name: the field benchmark page, every number a median of its results
        run: node scripts/sdk_check_bench_field.mjs
      - name: server rendering and hydration
        run: npm run test:ssr -w @temporeum/timeline-docs
      - name: touch
        run: npm run test:e2e:touch -w @temporeum/timeline-docs
      - name: the vis-timeline migration guide
        run: npm run test:migration -w @temporeum/timeline-docs
      - name: exports map, from the packed tarballs
        run: node scripts/sdk_check_exports.mjs
      - name: every public name documented, no positional booleans
        run: node scripts/sdk_check_api_docs.mjs
      - name: conformance report complete, its citations exist, no bare WCAG claim
        run: node scripts/sdk_check_acr.mjs --static
      - name: no core option dropped silently, no gesture-only capability
        run: |
          npm run test:passthrough -w @temporeum/timeline-element
          npm run test:gesture-parity -w @temporeum/timeline-element
      # vitest alone is green when a claim's test is deleted or skipped; the checkers notice.
      - name: every claim check of the core (a minimum of tests, each claim passing, a negative control)
        run: node scripts/sdk_test_claims.mjs
      - name: the changelogs have an entry for the version
        run: node scripts/sdk_changelog.mjs --check-entry
      - name: what npm would receive (dry run)
        run: node scripts/sdk_check_pack.mjs

  # The element's browser suite, and the touch gestures, in the other two
  # engines the stability page promises. The two touch-action claims only
  # real Mobile Safari can measure run before a release (RELEASING.md).
  engines:
    name: firefox and webkit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build -w packages/core -w packages/web-component
      - name: the element's browser suite in Firefox and WebKit
        run: node scripts/sdk_test_browsers.mjs
      - name: touch in WebKit, on an emulated iPhone and iPad
        run: npm run test:e2e:touch:webkit:linux -w @temporeum/timeline-docs

  # The browser suites above run on the newest framework versions the lockfile
  # holds; this job runs them on the lowest each peer range admits (React 18,
  # Vue 3.5.0, Svelte 5.46.4, Angular 21.0.0). It rewrites the manifests and
  # the lockfile — on this throwaway checkout only.
  lowest-peers:
    name: lowest framework versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: every framework package on the lowest version its peer range admits
        run: node scripts/sdk_test_lowest_peers.mjs --throwaway

  # The other end of each range: the newest version it admits, from the
  # registry, wherever development is not already on it (Angular 22, while the
  # lockfile holds 21). A package already on its newest is skipped.
  newest-peers:
    name: newest framework versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: every framework package on the newest version its peer range admits
        run: node scripts/sdk_test_lowest_peers.mjs --throwaway --highest

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # What a user installs blocks: the six packages and what they depend on.
      - run: npm audit --audit-level=high --omit=dev
      # The development tools are said, not blocking: an advisory in a linter must not hold a release.
      - run: npm audit --audit-level=high || echo "::warning::npm audit found an advisory in the development dependencies"
