  <style>.tl[data-tl-instance="360-vertical-light"]{--tl-surface:#ffffff;--tl-surface-alt:#f3f5f8;--tl-text:#1a1d21;--tl-text-muted:#5b6471;--tl-line:#d8dce2;--tl-line-strong:#737b87;--tl-item-fill:#dce9fd;--tl-item-stroke:#5b8fd6;--tl-item-text:#16222e;--tl-accent:#2f6fd0;--tl-now:#c62a4e;--tl-era:#eceefb;--tl-era-text:#3c3f66;--tl-marker:#6f41ba;--tl-focus:#1d4ed8}.tl[data-tl-instance="360-vertical-light"]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;transition:letter-spacing 1ms,word-spacing 1ms;transition-behavior:allow-discrete;display:block}.tl[data-tl-instance="360-vertical-light"] .tl-surface{fill:var(--tl-surface)}.tl[data-tl-instance="360-vertical-light"] .tl-band{fill:var(--tl-surface-alt)}.tl[data-tl-instance="360-vertical-light"] .tl-lane{fill:none}.tl[data-tl-instance="360-vertical-light"] .tl-lane--pinned{fill:var(--tl-surface-alt)}.tl[data-tl-instance="360-vertical-light"] .tl-tick{stroke:var(--tl-line);stroke-width:1}.tl[data-tl-instance="360-vertical-light"] .tl-tick--major{stroke:var(--tl-line-strong)}.tl[data-tl-instance="360-vertical-light"] .tl-tick-label{fill:var(--tl-text-muted);font-size:9px}.tl[data-tl-instance="360-vertical-light"] .tl-tick-label--major{fill:var(--tl-text)}.tl[data-tl-instance="360-vertical-light"] .tl-axis-context{fill:var(--tl-surface)}.tl[data-tl-instance="360-vertical-light"] .tl-item{fill:var(--tl-item-fill);stroke:var(--tl-item-stroke);stroke-width:1}.tl[data-tl-instance="360-vertical-light"] .tl-item--open{stroke-dasharray:4 3}.tl[data-tl-instance="360-vertical-light"] .tl-item--selected{stroke:var(--tl-focus);stroke-width:2}.tl[data-tl-instance="360-vertical-light"] .tl-label{fill:var(--tl-item-text);color:var(--tl-item-text);font-size:10px;pointer-events:none}.tl[data-tl-instance="360-vertical-light"] .tl-label&gt;div{white-space:pre;margin:0;padding:0 0 0 4px;line-height:12px;height:100%;align-content:unsafe center;overflow:hidden;text-overflow:ellipsis}.tl[data-tl-instance="360-vertical-light"] .tl-label--after{fill:var(--tl-text);color:var(--tl-text)}.tl[data-tl-instance="360-vertical-light"] .tl-cluster{fill:var(--tl-accent);stroke:var(--tl-surface);stroke-width:1;cursor:zoom-in}.tl[data-tl-instance="360-vertical-light"] .tl-cluster--selected{stroke:var(--tl-focus);stroke-width:2}.tl[data-tl-instance="360-vertical-light"] .tl-cluster-count{fill:var(--tl-surface);color:var(--tl-surface);font-weight:600}.tl[data-tl-instance="360-vertical-light"] .tl-label--after.tl-cluster-count{fill:var(--tl-text);color:var(--tl-text)}.tl[data-tl-instance="360-vertical-light"] .tl-era{fill:var(--tl-era)}.tl[data-tl-instance="360-vertical-light"] .tl-era-label{fill:var(--tl-era-text);font-size:9px}.tl[data-tl-instance="360-vertical-light"] .tl-now{stroke:var(--tl-now);stroke-width:2}.tl[data-tl-instance="360-vertical-light"] .tl-now-label{fill:var(--tl-now);font-size:9px}.tl[data-tl-instance="360-vertical-light"] .tl-marker{fill:var(--tl-marker)}.tl[data-tl-instance="360-vertical-light"] .tl-marker-label{fill:var(--tl-marker);font-size:9px}.tl[data-tl-instance="360-vertical-light"] .tl-accent{fill:var(--tl-accent)}.tl[data-tl-instance="360-vertical-light"]:focus-visible{outline:2px solid var(--tl-focus);outline-offset:-2px}.tl[data-tl-instance="360-vertical-light"] :focus-visible{outline:2px solid var(--tl-focus);outline-offset:1px}.tl[data-tl-instance="360-vertical-light"] .tl-focus-ring{fill:none;stroke:var(--tl-focus);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}.tl[data-tl-instance="360-vertical-light"]:not(:focus) .tl-focus-ring{display:none}.tl[data-tl-instance="360-vertical-light"] .tl-loading{stroke:var(--tl-accent);stroke-width:3;stroke-dasharray:10 5;vector-effect:non-scaling-stroke;pointer-events:none;animation:tl-loading 0.9s linear infinite}.tl[data-tl-instance="360-vertical-light"] .tl-loading--failed{stroke:var(--tl-now);stroke-dasharray:2 4;animation:none}@keyframes tl-loading{to{stroke-dashoffset:-15}}@media (prefers-reduced-motion:reduce){.tl[data-tl-instance="360-vertical-light"] .tl-loading{animation:none}}@media (forced-colors:active){.tl[data-tl-instance="360-vertical-light"],.tl[data-tl-instance="360-vertical-light"]:not([data-tl-theme="light"]),.tl[data-tl-instance="360-vertical-light"][data-tl-theme]{--tl-surface:Canvas;--tl-surface-alt:Canvas;--tl-text:CanvasText;--tl-text-muted:CanvasText;--tl-line:GrayText;--tl-line-strong:CanvasText;--tl-item-fill:Canvas;--tl-item-stroke:CanvasText;--tl-item-text:CanvasText;--tl-accent:CanvasText;--tl-now:CanvasText;--tl-era:Canvas;--tl-era-text:CanvasText;--tl-marker:CanvasText;--tl-focus:Highlight}.tl[data-tl-instance="360-vertical-light"] .tl-item--selected,.tl[data-tl-instance="360-vertical-light"] .tl-cluster--selected,.tl[data-tl-instance="360-vertical-light"] .tl-focus-ring{stroke-width:3}}.tl[data-tl-instance="360-vertical-light"]{touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}.tl[data-tl-instance="360-vertical-light"][data-tl-gesture="pan"],.tl[data-tl-instance="360-vertical-light"][data-tl-gesture="pinch"]{cursor:grabbing}.tl[data-tl-instance="360-vertical-light"][data-tl-edit="move"]{cursor:grabbing}.tl[data-tl-instance="360-vertical-light"][data-tl-edit="resize-start"],.tl[data-tl-instance="360-vertical-light"][data-tl-edit="resize-end"]{cursor:ns-resize}</style>
