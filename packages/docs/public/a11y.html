<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline SDK — accessibility beyond axe</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        padding: 4px 8px;
        font-size: 14px;
      }
      #timeline {
        width: 100%;
      }
      /* ?clip=1: a card that clips what sticks out of it, exactly the timeline's size. */
      .clip {
        overflow: hidden;
        margin: 16px;
      }
      .clip #timeline {
        width: 640px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@temporeum/timeline-core": "/core/index.mjs",
          "@temporeum/timeline-core/dom": "/core/dom.mjs",
          "@temporeum/timeline-core/groups": "/core/groups.mjs",
          "@temporeum/timeline-core/items": "/core/items.mjs",
          "@temporeum/timeline-core/gantt": "/core/gantt.mjs",
          "@temporeum/timeline-core/resources": "/core/resources.mjs",
          "@temporeum/timeline-core/tools": "/core/tools.mjs",
          "@temporeum/timeline-core/export": "/core/export.mjs",
          "@temporeum/timeline-core/intl": "/core/intl.mjs",
          "@temporeum/timeline-core/live": "/core/live.mjs",
          "@temporeum/timeline-core/words": "/core/words.mjs",
          "@temporeum/timeline-core/calendar": "/core/calendar.mjs",
          "@temporeum/timeline-element": "/element/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Release plan</h1>
      <div id="box">
        <div id="timeline"></div>
      </div>
    </main>
    <script type="module">
      /*
       * The criteria a scan cannot judge (G-AXE's second half), on the
       * ELEMENT — what a host installs, with its own canvas measurement of
       * the labels and its own decision about orientation and density:
       *
       *   reflow at 320 CSS pixels and 256 pixels tall (1.4.10),
       *   text spacing (1.4.12) and text size (1.4.4),
       *   the focus outline inside a container that clips (2.4.7).
       *
       * ?height=<px>  the host's height for the timeline (default 520)
       * ?clip=1       the timeline in an overflow: hidden card of exactly its size
       *
       * The page decides nothing about the drawing: the element does.
       */
      import { createTimeline } from "@temporeum/timeline-element";

      const DAY = 86_400_000;
      const START = Date.UTC(2026, 0, 1);
      const params = new URLSearchParams(location.search);
      const height = Number(params.get("height") ?? 520);
      const element = document.querySelector("#timeline");
      element.style.height = `${String(height)}px`;
      if (params.get("clip") === "1") {
        document.querySelector("#box").className = "clip";
        document.querySelector("#box").style.width = "640px";
        document.querySelector("#box").style.height = `${String(height)}px`;
      }

      // The responsive page's data: four-day items over sixty days, labels
      // from five letters to eleven, and one true moment.
      const items = [
        { id: "a", start: START + 2 * DAY, end: START + 6 * DAY, label: "Planning", laneId: "l1" },
        { id: "b", start: START + 4 * DAY, end: START + 8 * DAY, label: "Build", laneId: "l1" },
        { id: "c", start: START + 14 * DAY, end: START + 18 * DAY, label: "Testing", laneId: "l1" },
        { id: "d", start: START + 24 * DAY, end: START + 28 * DAY, label: "Handover", laneId: "l2" },
        { id: "e", start: START + 34 * DAY, end: START + 38 * DAY, label: "Rollout", laneId: "l2" },
        { id: "f", start: START + 46 * DAY, end: START + 50 * DAY, label: "Measurement", laneId: "l2" },
        { id: "g", start: START + 56 * DAY, end: START + 60 * DAY, label: "Wrap-up", laneId: "l1" },
        { id: "moment", start: START + 41 * DAY, label: "Milestone", laneId: "l1" },
      ];
      const timeline = createTimeline(element, {
        items,
        lanes: [
          { id: "l1", label: "Work" },
          { id: "l2", label: "Delivery" },
        ],
        domain: [START, START + 60 * DAY],
        timeZone: "UTC",
        locale: "en-GB",
        ariaLabel: "Release plan",
      });

      window.tl = {
        get ready() {
          return element.querySelector("svg [role=option]") !== null;
        },
        focusedId: () => timeline.getSnapshot().focusedId,
        selectedIds: () => timeline.getSnapshot().selectedIds,
        /** Every item's whole label: what its accessible name has to keep, however the drawing shortens it. */
        labels: Object.fromEntries(items.map((item) => [item.id, item.label])),
      };
    </script>
  </body>
</html>
