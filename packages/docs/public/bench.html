<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temporeum Timeline — performance measurement</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      /* The measured container. Its width is the viewport's (1440), its height
         is fixed, so the number of visible items does not depend on the browser window. */
      #frame {
        position: relative;
        height: 900px;
        overflow: hidden;
      }
      #frame svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="frame" data-bench="temporeum-timeline"></div>

    <script type="module">
      /*
       * The measurement page. Not a demo: everything that happens here is the
       * host path the README recommends — real attachInput, real machine, frame
       * loop, item space, patcher. The measurement measures the page's OWN
       * path, not a benchmark-specific shortcut.
       *
       * ?mode=space   (default) the recommended path: item space + patcher
       * ?mode=exact   negative control: no item space, every frame exact
       * ?pool=0       negative control for memory: a patcher without a pool
       * ?levels=0     negative control for deep zoom (the perf-deep check): re-anchoring
       *               during the gesture in one frame, without steps
       * ?run=0        negative control for wheel zoom (the perf-wheel check): the page
       *               does not treat the wheel burst as a gesture (the earlier
       *               machine), so it comes to rest after every wheel step
       * ?overscan=, ?maxStretch=, ?growth=   planner tuning, for experiments; the
       *               check measures the defaults
       */
      import { createInputMachine, planSceneSpace, renderTimeline } from "/core/index.mjs";
      import { attachInput, createFrameLoop, mountScene } from "/core/dom.mjs";
      import { benchDomain, benchItems, createBenchKit, nextFrame, sleep, START } from "/bench-kit.mjs";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") === "exact" ? "exact" : "space";
      const poolLimit = params.has("pool") ? Number(params.get("pool")) : undefined;
      // The README's recommended path: the gesture re-anchors in steps of two,
      // and the old scale's tiles stand in while the new one fills.
      const plan = { levels: params.get("levels") !== "0" };
      const wheelRun = params.get("run") !== "0";
      for (const name of ["overscan", "maxStretch", "growth"]) {
        if (params.has(name)) plan[name] = Number(params.get(name));
      }

      // The data and the starting view come from the shared kit (bench-kit.mjs):
      // the perf-public check's page measures the same.
      const items = benchItems();
      const total = items[items.length - 1].end - START;

      const frame = document.querySelector("#frame");
      const width = () => frame.clientWidth;
      const height = () => frame.clientHeight;
      const density = "dense";

      let domain = benchDomain(items);
      let crossOffset = 0;
      let gesture = false;
      let space;
      let result;
      const anchors = [];

      const machine = createInputMachine({
        domain,
        mainSize: width(),
        crossSize: height(),
        orientation: "horizontal",
        touchAction: "own",
      });
      const mount = mountScene(frame, poolLimit === undefined ? {} : { poolLimit });

      /** Render and patch time per frame — diagnostics. */
      const drawTimes = [];

      function draw() {
        const began = performance.now();
        if (mode === "space") {
          const next = planSceneSpace(space, { domain, mainSize: width() }, { ...plan, settle: !gesture });
          // Re-anchoring: a new origin or a new scale — then every drawn node
          // is rewritten. A change in the drawn range is not one.
          if (space === undefined || next.origin !== space.origin || next.msPerPx !== space.msPerPx) {
            anchors.push(performance.now());
          }
          space = next;
        }
        result = renderTimeline({
          items,
          domain,
          width: width(),
          height: height(),
          density,
          crossOffset,
          instanceId: "bench",
          ...(mode === "space" ? { space } : {}),
        });
        const rendered = performance.now();
        mount.update(result.scene);
        drawTimes.push({ at: began, render: rendered - began, mount: performance.now() - rendered, pending: result.pendingTiles, gesture });
        // At rest the planner fills the overscan frame by frame: if replanning
        // gives a different answer, there is still something to draw. After a
        // stepped re-anchor, also for as long as the old scale's tiles stand in.
        if (mode === "space" && !gesture) {
          const again = planSceneSpace(space, { domain, mainSize: width() }, { ...plan, settle: true });
          if (again !== space) loop.request();
        }
        if (result.pendingTiles > 0) loop.request();
      }

      const loop = createFrameLoop(frame, draw);

      attachInput(frame, {
        machine,
        onEffects(effects) {
          for (const effect of effects) {
            if (effect.type === "viewport") {
              domain = effect.domain;
              crossOffset = effect.crossOffset;
            } else if (effect.type === "gestureStart") {
              if (wheelRun || effect.kind !== "wheel") gesture = true;
            } else if (effect.type === "gestureEnd") {
              gesture = false;
            }
          }
          loop.request();
        },
      });

      draw();
      machine.resize({ contentCrossSize: result.contentCrossSize });

      // --- measuring tools ---------------------------------------------------

      async function settleAt(nextDomain) {
        machine.setDomain(nextDomain);
        domain = machine.domain;
        gesture = false;
        loop.request();
        await nextFrame();
        await nextFrame();
      }

      const origin = [...domain];
      const kit = createBenchKit({ frame, counters: () => loop.stats, settleAt, origin });
      const { visibility, performGesture } = kit;

      const extras = {
        start() {
          drawTimes.length = 0;
          return anchors.length;
        },
        end(anchorsBefore) {
          return {
            mode,
            reanchors: anchors.length - anchorsBefore,
            slowestDraws: [...drawTimes]
              .sort((a, b) => b.render + b.mount - (a.render + a.mount))
              .slice(0, 4)
              .map((entry) => ({ render: Math.round(entry.render), mount: Math.round(entry.mount) })),
            ...(params.has("trace") ? { trace: drawTimes.map((entry) => [Math.round(entry.at), Math.round(entry.render), Math.round(entry.mount), entry.pending, entry.gesture]) } : {}),
          };
        },
      };
      const scenario = (name) => kit.scenario(name, extras);

      /**
       * A long pan for memory: the view moves to the start of the data, then the
       * measuring script calls `swipe` once per drag and reads the browser's own
       * counters (CDP) along the way.
       */
      async function prepareLongPan() {
        await settleAt([START, START + total * 0.2]);
        return { ...mount.stats, ...visibility() };
      }

      async function swipe() {
        await performGesture(400, (u) => [{ x: 1000 - 240 * u, y: height() / 2 }]);
        await sleep(30);
        // The live label nodes: the memory check does not charge the pool for creation
        // that grows with their number (it cannot hand back a label while none
        // has been released), and it subtracts them from the live DOM too.
        // A label is a foreignObject and an HTML row: two elements
        // (labelNodes), three nodes with its text (labelTree) — the way the
        // patcher and CDP count them.
        let labelTree = 0;
        for (const label of frame.querySelectorAll(".tl-label")) {
          const walker = document.createTreeWalker(label);
          for (let node = walker.currentNode; node !== null; node = walker.nextNode()) labelTree += 1;
        }
        return {
          ...mount.stats,
          ...visibility(),
          labelNodes: frame.querySelectorAll(".tl-label, .tl-label *").length,
          labelTree,
          domainStart: domain[0],
          dataEnd: START + total,
        };
      }

      let build;
      try {
        build = await (await fetch("/core/build.json", { cache: "no-store" })).json();
      } catch {
        build = undefined;
      }

      window.tlBench = {
        marker: "temporeum-timeline-bench",
        build,
        mode,
        poolLimit: poolLimit ?? null,
        levels: plan.levels,
        wheelRun,
        totalItems: items.length,
        scenario,
        startWheel: () => kit.startRecording(extras),
        stopWheel: () => kit.stopRecording(),
        domain: () => [...domain],
        prepareLongPan,
        swipe,
        visibility,
        stats: () => ({ mount: mount.stats, loop: loop.stats }),
      };
    </script>
  </body>
</html>
