<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idővonal SDK — teljesítmény-mérés (G-PERF, G-MEMORY)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      /* A mért konténer. A szélessége a nézetablaké (1440), a magassága
         rögzített, hogy a látható elemszám ne a böngésző ablakán múljon. */
      #frame {
        position: relative;
        height: 900px;
        overflow: hidden;
      }
      #frame svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="frame" data-bench="temporeum-timeline"></div>

    <script type="module">
      /*
       * A mérés lapja. Nem demó: minden, ami itt történik, az a hoszt útja,
       * amit a README ajánl — igazi attachInput, igazi gép, képkocka-hurok,
       * elemtér, foltozó. A mérés a lap SAJÁT útját méri, nem egy
       * benchmark-specifikus rövidítést.
       *
       * ?mode=space   (alap) az ajánlott út: elemtér + foltozó
       * ?mode=exact   negatív kontroll: elemtér nélkül, minden képkocka pontos
       * ?pool=0       negatív kontroll a memóriához: pool nélküli foltozó
       * ?levels=0     negatív kontroll a mély zoomhoz (G-PERF-DEEP): a gesztus
       *               közbeni újrahorgonyzás egy képkockában, lépcsők nélkül
       * ?run=0        negatív kontroll a görgős zoomhoz (G-PERF-WHEEL): a lap
       *               nem veszi gesztusnak a görgő-sorozatot (a P15 előtti
       *               gép), így minden görgő-lépés után nyugalomba áll
       * ?overscan=, ?maxStretch=, ?growth=   a tervező hangolása, kísérletezéshez; a
       *               kapu az alapértékeket méri
       */
      import { createInputMachine, planSceneSpace, renderTimeline } from "/core/index.mjs";
      import { attachInput, createFrameLoop, mountScene } from "/core/dom.mjs";
      import { benchDomain, benchItems, createBenchKit, nextFrame, sleep, START } from "/bench-kit.mjs";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") === "exact" ? "exact" : "space";
      const poolLimit = params.has("pool") ? Number(params.get("pool")) : undefined;
      // A README ajánlott útja: a gesztus kettes lépcsőkben horgonyoz újra, és
      // a régi lépték csempéi helyettesítenek, amíg az új feltöltődik.
      const plan = { levels: params.get("levels") !== "0" };
      const wheelRun = params.get("run") !== "0";
      for (const name of ["overscan", "maxStretch", "growth"]) {
        if (params.has(name)) plan[name] = Number(params.get(name));
      }

      // Az adat és a kiinduló nézet a közös készletből (bench-kit.mjs): a
      // G-PERF-PUBLIC lapja ugyanezt méri.
      const items = benchItems();
      const total = items[items.length - 1].end - START;

      const frame = document.querySelector("#frame");
      const width = () => frame.clientWidth;
      const height = () => frame.clientHeight;
      const density = "dense";

      let domain = benchDomain(items);
      let crossOffset = 0;
      let gesture = false;
      let space;
      let result;
      const anchors = [];

      const machine = createInputMachine({
        domain,
        mainSize: width(),
        crossSize: height(),
        orientation: "horizontal",
        touchAction: "own",
      });
      const mount = mountScene(frame, poolLimit === undefined ? {} : { poolLimit });

      /** Képkockánként a renderelés és a foltozás ideje — diagnosztika. */
      const drawTimes = [];

      function draw() {
        const began = performance.now();
        if (mode === "space") {
          const next = planSceneSpace(space, { domain, mainSize: width() }, { ...plan, settle: !gesture });
          // Újrahorgonyzás: új origó vagy új lépték — ilyenkor minden
          // megrajzolt csomópont újraíródik. A rajzolt tartomány változása nem az.
          if (space === undefined || next.origin !== space.origin || next.msPerPx !== space.msPerPx) {
            anchors.push(performance.now());
          }
          space = next;
        }
        result = renderTimeline({
          items,
          domain,
          width: width(),
          height: height(),
          density,
          crossOffset,
          instanceId: "bench",
          ...(mode === "space" ? { space } : {}),
        });
        const rendered = performance.now();
        mount.update(result.scene);
        drawTimes.push({ at: began, render: rendered - began, mount: performance.now() - rendered, pending: result.pendingTiles, gesture });
        // A tervező a nyugalomban képkockánként tölti fel a ráhagyást: ha
        // újratervezve mást mond, még van mit rajzolni. Lépcsős újrahorgonyzás
        // után pedig addig, amíg a régi lépték csempéi helyettesítenek.
        if (mode === "space" && !gesture) {
          const again = planSceneSpace(space, { domain, mainSize: width() }, { ...plan, settle: true });
          if (again !== space) loop.request();
        }
        if (result.pendingTiles > 0) loop.request();
      }

      const loop = createFrameLoop(frame, draw);

      attachInput(frame, {
        machine,
        onEffects(effects) {
          for (const effect of effects) {
            if (effect.type === "viewport") {
              domain = effect.domain;
              crossOffset = effect.crossOffset;
            } else if (effect.type === "gestureStart") {
              if (wheelRun || effect.kind !== "wheel") gesture = true;
            } else if (effect.type === "gestureEnd") {
              gesture = false;
            }
          }
          loop.request();
        },
      });

      draw();
      machine.resize({ contentCrossSize: result.contentCrossSize });

      // --- mérőeszközök -------------------------------------------------------

      async function settleAt(nextDomain) {
        machine.setDomain(nextDomain);
        domain = machine.domain;
        gesture = false;
        loop.request();
        await nextFrame();
        await nextFrame();
      }

      const origin = [...domain];
      const kit = createBenchKit({ frame, counters: () => loop.stats, settleAt, origin });
      const { visibility, performGesture } = kit;

      const extras = {
        start() {
          drawTimes.length = 0;
          return anchors.length;
        },
        end(anchorsBefore) {
          return {
            mode,
            reanchors: anchors.length - anchorsBefore,
            slowestDraws: [...drawTimes]
              .sort((a, b) => b.render + b.mount - (a.render + a.mount))
              .slice(0, 4)
              .map((entry) => ({ render: Math.round(entry.render), mount: Math.round(entry.mount) })),
            ...(params.has("trace") ? { trace: drawTimes.map((entry) => [Math.round(entry.at), Math.round(entry.render), Math.round(entry.mount), entry.pending, entry.gesture]) } : {}),
          };
        },
      };
      const scenario = (name) => kit.scenario(name, extras);

      /**
       * Hosszú pásztázás a memóriához: a nézet az adat elejére áll, aztán a
       * mérő szkript húzásonként hívja a `swipe`-ot, és közben a böngésző saját
       * számlálóit (CDP) is leolvassa.
       */
      async function prepareLongPan() {
        await settleAt([START, START + total * 0.2]);
        return { ...mount.stats, ...visibility() };
      }

      async function swipe() {
        await performGesture(400, (u) => [{ x: 1000 - 240 * u, y: height() / 2 }]);
        await sleep(30);
        // Az élő címke-csomópontok: a G-MEMORY a számukkal együtt növő
        // létrehozást nem rója fel a poolnak (az nem adhat vissza címkét,
        // amíg egy sem volt elengedve), és az élő DOM-ból is levonja őket.
        // A P17 óta egy címke egy foreignObject és egy HTML-sor: két elem
        // (labelNodes), a szövegével három csomópont (labelTree) — ahogy a
        // foltozó és a CDP számolja.
        let labelTree = 0;
        for (const label of frame.querySelectorAll(".tl-label")) {
          const walker = document.createTreeWalker(label);
          for (let node = walker.currentNode; node !== null; node = walker.nextNode()) labelTree += 1;
        }
        return {
          ...mount.stats,
          ...visibility(),
          labelNodes: frame.querySelectorAll(".tl-label, .tl-label *").length,
          labelTree,
          domainStart: domain[0],
          dataEnd: START + total,
        };
      }

      let build;
      try {
        build = await (await fetch("/core/build.json", { cache: "no-store" })).json();
      } catch {
        build = undefined;
      }

      window.tlBench = {
        marker: "temporeum-timeline-bench",
        build,
        mode,
        poolLimit: poolLimit ?? null,
        levels: plan.levels,
        wheelRun,
        totalItems: items.length,
        scenario,
        startWheel: () => kit.startRecording(extras),
        stopWheel: () => kit.stopRecording(),
        domain: () => [...domain],
        prepareLongPan,
        swipe,
        visibility,
        stats: () => ({ mount: mount.stats, loop: loop.stats }),
      };
    </script>
  </body>
</html>
