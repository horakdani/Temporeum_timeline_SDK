<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline SDK — clustering at dense zoom</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #frame svg {
        display: block;
        width: 100%;
      }
      #bar {
        padding: 0.4rem 0.6rem;
        font-size: 12px;
        color: #445;
      }
      #members {
        margin: 0 0.6rem;
        padding-left: 1.2rem;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="margin: 0; padding: 0.4rem 0.6rem; font-size: 14px">Releases, alerts, backups — three years</h1>
      <div id="frame" lang="en-GB"></div>
      <p id="bar" aria-live="polite"></p>
      <ul id="members" aria-label="Cluster members"></ul>
      <p style="margin: 0; padding: 0 0.6rem; font-size: 12px; color: #445">
        Where items are too dense to be seen one by one, a marker with their count stands in their
        place. A tap or Enter zooms in until they separate; at the zoom limit the list shows
        them.
      </p>
    </main>

    <script type="module">
      import {
        clusterZoom,
        createHitTester,
        createInputMachine,
        createNavigator,
        createTimeScale,
        densityMetrics,
        renderTimeline,
      } from "/core/index.mjs";
      import { attachInput, mountScene } from "/core/dom.mjs";

      const params = new URLSearchParams(location.search);
      const DAY = 86_400_000;
      const HOUR = 3_600_000;
      const START = Date.UTC(2023, 0, 1);
      let seed = Number(params.get("seed") ?? 11);
      const random = () => {
        // mulberry32: the same seed, the same data.
        seed = (seed + 0x6d2b79f5) >>> 0;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      // The page plays a host that names its clusters in its own words
      // (`describeCluster` below, with the "en-GB" locale): "events", not the
      // library's default "items". The frame carries lang="en-GB".
      const KINDS = ["Release", "Alert", "Backup", "Deployment"];
      const items = [];
      // Dense bursts — an incident's alerts, a release week — and sparse, long
      // jobs between them.
      for (let burst = 0; burst < 90; burst += 1) {
        const centre = START + Math.floor(random() * 3 * 365) * DAY;
        const count = 3 + Math.floor(random() * 40);
        const spread = (0.2 + random() * 6) * DAY;
        const lane = `l${burst % 3}`;
        for (let k = 0; k < count; k += 1) {
          const start = centre + Math.floor(random() * spread);
          items.push({
            id: `e${items.length}`,
            start,
            ...(random() < 0.3 ? { end: start + Math.floor(random() * 4 * HOUR) + 1 } : {}),
            label: KINDS[items.length % KINDS.length],
            laneId: lane,
          });
        }
      }
      for (let k = 0; k < 40; k += 1) {
        const start = START + Math.floor(random() * 3 * 365) * DAY;
        items.push({ id: `w${k}`, start, end: start + Math.floor((5 + random() * 60) * DAY), label: "Project", laneId: `l${k % 3}` });
      }
      const lanes = [
        { id: "l0", label: "Production" },
        { id: "l1", label: "Staging" },
        { id: "l2", label: "Development" },
      ];

      const frame = document.querySelector("#frame");
      const bar = document.querySelector("#bar");
      const list = document.querySelector("#members");
      const mount = mountScene(frame);
      const orientation = params.get("orientation") === "vertical" ? "vertical" : "horizontal";
      const density = "comfortable";
      const metrics = densityMetrics(density, orientation);
      const crossSize = orientation === "horizontal" ? 300 : 360;
      const sizes = () => {
        const width = frame.clientWidth;
        return orientation === "horizontal" ? { width, height: crossSize, mainSize: width } : { width, height: 720, mainSize: 720 };
      };
      let domain = [START, START + 3 * 365 * DAY];
      let selected = [];
      let result;
      let draws = 0;
      const limits = { min: START - 60 * DAY, max: START + 4 * 365 * DAY, minSpanMs: HOUR };
      const machine = createInputMachine({
        domain,
        mainSize: sizes().mainSize,
        crossSize: orientation === "horizontal" ? crossSize : frame.clientWidth,
        orientation,
        limits,
      });

      const dateFormat = new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeZone: "UTC" });
      const laneLabels = new Map(lanes.map((lane) => [lane.id, lane.label]));
      function describeCluster(cluster) {
        const from = dateFormat.format(cluster.start);
        const to = dateFormat.format(cluster.lastStart);
        return `${cluster.members.length} events, ${from === to ? from : `${from} – ${to}`}, ${laneLabels.get(cluster.laneId)}`;
      }

      /**
       * NEGATIVE CONTROL (`?lossy=1`): the page drops one standalone item from
       * every frame before it reaches the DOM. It exists only so the test can
       * prove that the detector looks at the live DOM and notices a lost item
       * — otherwise a zero would mean nothing.
       */
      const lossy = params.get("lossy") === "1";
      function withoutOneItem(scene) {
        let dropped = false;
        const strip = (node) => {
          const children = [];
          for (const child of node.children ?? []) {
            if (!dropped && child.attrs?.["data-tl-id"] !== undefined && child.attrs?.role === "option") {
              dropped = true;
              continue;
            }
            children.push(strip(child));
          }
          return node.children === undefined ? node : { ...node, children };
        };
        return strip(scene);
      }

      function draw() {
        const { width, height } = sizes();
        result = renderTimeline({
          items,
          lanes,
          domain,
          width,
          height,
          orientation,
          density,
          locale: "en-GB",
          ariaLabel: "Event timeline",
          instanceId: "cl",
          focusedId: machine.focusedId,
          selectedIds: selected,
          crossOffset: machine.crossOffset,
          cluster: true,
          // The cluster name in the host's own words: the library's default is
          // "23 items, …".
          hooks: { describeCluster },
        });
        mount.update(lossy ? withoutOneItem(result.scene) : result.scene);
        draws += 1;
        machine.setKeyboard({
          navigator: createNavigator(result.layout, { crossInset: metrics.axisSize, clustering: result.clustering }),
        });
        bar.textContent = `${result.visibleCount} items visible, in ${result.clusters.length} clusters or one by one`;
      }

      /** The host's response to a cluster: it zooms in; at the zoom limit it opens the list. */
      function open(cluster, anchor) {
        const scale = createTimeScale(domain, sizes().mainSize);
        const zoom = clusterZoom(cluster, scale, anchor === undefined ? {} : { anchor });
        const effects = machine.zoom(zoom.factor, zoom.anchor);
        const atLimit = effects.some((effect) => effect.type === "viewport" && effect.atLimit);
        handle(effects);
        list.replaceChildren();
        if (atLimit && result.clustering?.byId(cluster.id) !== undefined) {
          for (const member of cluster.members) {
            const entry = document.createElement("li");
            entry.textContent = `${member.item.label} — ${new Date(member.item.start).toISOString().slice(0, 16)}`;
            list.append(entry);
          }
        }
        window.tl.opened.push({ id: cluster.id, count: cluster.members.length, factor: zoom.factor, anchor: zoom.anchor });
      }

      function handle(effects) {
        for (const effect of effects) {
          if (effect.type === "viewport") {
            domain = effect.domain;
          }
        }
        draw();
        for (const effect of effects) {
          if (effect.type === "tap" && effect.tapCount === 1 && effect.pointerCount === 1) {
            const tester = createHitTester({
              layout: result.layout,
              scale: createTimeScale(domain, sizes().mainSize),
              crossInset: metrics.axisSize,
              crossOffset: machine.crossOffset,
              density,
              clusters: result.clusters,
            });
            const point = { main: effect.main, cross: effect.cross };
            const cluster = tester.clusterAt(point, effect.pointerType);
            if (cluster !== undefined) {
              open(cluster, effect.main);
              return;
            }
            const hit = tester.hitTest(point, effect.pointerType);
            selected = hit === undefined ? [] : [hit.item.id];
            draw();
          } else if (effect.type === "activate") {
            const cluster = effect.id === null ? undefined : result.clustering?.byId(effect.id);
            if (cluster !== undefined) {
              open(cluster);
              return;
            }
            selected = effect.id === null ? [] : [effect.id];
            draw();
          }
        }
      }

      attachInput(frame, { machine, onEffects: handle });

      /**
       * The test's verdict: the LIVE DOM's items and markers, compared with the
       * frame the same renderer would draw without clustering.
       */
      function measure() {
        const { width, height } = sizes();
        const plain = renderTimeline({
          items: [...items],
          lanes,
          domain,
          width,
          height,
          orientation,
          density,
          crossOffset: machine.crossOffset,
        });
        const visible = new Set();
        const walk = (node) => {
          if (node.attrs?.["data-tl-id"] !== undefined) visible.add(String(node.attrs["data-tl-id"]));
          for (const child of node.children ?? []) walk(child);
        };
        walk(plain.scene);
        const layer = frame.querySelector(".tl-layer--items");
        const singles = [...layer.querySelectorAll("[data-tl-id]")].map((node) => node.getAttribute("data-tl-id"));
        const markers = [...layer.querySelectorAll("[data-tl-cluster]")].map((node) => ({
          id: node.getAttribute("data-tl-cluster"),
          count: Number(node.getAttribute("data-tl-count")),
          role: node.getAttribute("role"),
        }));
        const problems = [];
        const seen = new Map();
        for (const id of singles) {
          if (!visible.has(id)) problems.push(`${id}: drawn, but not visible`);
          seen.set(id, (seen.get(id) ?? 0) + 1);
        }
        let sum = singles.length;
        for (const marker of markers) {
          const cluster = result.clustering?.byId(marker.id);
          if (cluster === undefined) {
            problems.push(`${marker.id}: a marker of no cluster`);
            continue;
          }
          if (cluster.members.length !== marker.count) problems.push(`${marker.id}: says ${marker.count}, has ${cluster.members.length}`);
          if (marker.role !== "option") problems.push(`${marker.id}: not an option`);
          if (!cluster.members.some((member) => visible.has(member.item.id))) problems.push(`${marker.id}: no member visible`);
          sum += marker.count;
          for (const member of cluster.members) seen.set(member.item.id, (seen.get(member.item.id) ?? 0) + 1);
        }
        for (const id of visible) {
          const times = seen.get(id) ?? 0;
          if (times !== 1) problems.push(`${id}: shown ${times} times`);
        }
        if (sum !== seen.size) problems.push(`counts add up to ${sum}, ${seen.size} represented`);
        return { visible: visible.size, sum, singles: singles.length, markers: markers.length, extras: seen.size - visible.size, problems, draws };
      }

      window.tl = {
        machine,
        opened: [],
        measure,
        get domain() {
          return domain;
        },
        get result() {
          return result;
        },
      };

      draw();
      new ResizeObserver(() => {
        if (frame.clientWidth > 0) {
          machine.resize({ mainSize: sizes().mainSize, crossSize: orientation === "horizontal" ? crossSize : frame.clientWidth });
          draw();
        }
      }).observe(frame);
    </script>
  </body>
</html>
