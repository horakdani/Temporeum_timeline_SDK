<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline SDK — measuring the public path (G-PERF-PUBLIC)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      /* The same frame as in bench.html: 1440 wide, 900 high. */
      #frame {
        position: relative;
        height: 900px;
        overflow: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@temporeum/timeline-core": "/core/index.mjs",
          "@temporeum/timeline-core/dom": "/core/dom.mjs",
          "@temporeum/timeline-core/groups": "/core/groups.mjs",
          "@temporeum/timeline-core/items": "/core/items.mjs",
          "@temporeum/timeline-core/gantt": "/core/gantt.mjs",
          "@temporeum/timeline-core/resources": "/core/resources.mjs",
          "@temporeum/timeline-core/tools": "/core/tools.mjs",
          "@temporeum/timeline-core/export": "/core/export.mjs",
          "@temporeum/timeline-core/intl": "/core/intl.mjs",
          "@temporeum/timeline-core/live": "/core/live.mjs",
          "@temporeum/timeline-core/words": "/core/words.mjs",
          "@temporeum/timeline-core/calendar": "/core/calendar.mjs",
          "@temporeum/timeline-element": "/element/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="frame" data-bench="temporeum-timeline-public"></div>

    <script type="module">
      /*
       * Measuring the public path. Not the core's manual wiring (that is
       * bench.html), but what a user calls: `createTimeline` from the SHIPPED
       * element bundle, with the core's dist, on default settings — except
       * density, which the measurement's data needs, as in bench.html.
       * The same data, the same finger, the same counting (bench-kit.mjs).
       *
       * ?mode=space   (default) the configuration default, sceneSpace: "auto" —
       *               at 10,000 items this means item space
       * ?mode=exact   negative control: sceneSpace: false, every frame exact
       *               (the public path of 1.0.0-rc.0)
       * ?editing=1&density=auto   the settings of the vis comparison page
       *               (bench/temporeum.html: editing on, the default
       *               density) — G-PERF-WHEEL measures this way so that the
       *               check predicts the published number
       *
       * The page cannot see the loop (it is internal to the instance), so it
       * counts the loop's two numbers from outside: a requested draw is a
       * pointer event sent to the page, a drawn frame is the instance's
       * notification (`subscribe`) — which comes at most once per frame, and on
       * every frame in which the view changed.
       */
      import { createTimeline } from "@temporeum/timeline-element";
      import { benchDomain, benchItems, createBenchKit, nextFrame } from "/bench-kit.mjs";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") === "exact" ? "exact" : "space";

      const items = benchItems();
      const frame = document.querySelector("#frame");
      const origin = benchDomain(items);

      const timeline = createTimeline(frame, {
        items,
        domain: origin,
        density: params.get("density") ?? "dense",
        ariaLabel: "Ten thousand items",
        ...(params.has("editing") ? { editing: { enabled: true } } : {}),
        ...(mode === "exact" ? { sceneSpace: false } : {}),
      });
      let draws = 0;
      timeline.subscribe(() => {
        draws += 1;
      });

      async function settleAt(nextDomain) {
        timeline.zoomTo(nextDomain);
        await nextFrame();
        await nextFrame();
      }

      const kit = createBenchKit({
        frame,
        counters: () => ({ requests: kit.dispatched, frames: draws }),
        settleAt,
        origin,
      });

      // The first frame waits for the resize observer.
      while (timeline.result === undefined) await nextFrame();

      const extras = {
        end: () => ({ mode, reanchors: null, sceneSpace: frame.querySelector(".tl-tile") !== null }),
      };

      let builds;
      try {
        const [core, element] = await Promise.all(
          ["/core/build.json", "/element/build.json"].map(async (url) => (await fetch(url, { cache: "no-store" })).json()),
        );
        builds = { core: core.source, element: element.source };
      } catch {
        builds = undefined;
      }

      window.tlBench = {
        marker: "temporeum-timeline-bench-public",
        build: builds === undefined ? undefined : { source: `${builds.core}|${builds.element}` },
        mode,
        poolLimit: null,
        totalItems: items.length,
        scenario: (name) => kit.scenario(name, extras),
        startWheel: () => kit.startRecording(extras),
        stopWheel: () => kit.stopRecording(),
        domain: () => [...timeline.getSnapshot().domain],
        visibility: kit.visibility,
      };
    </script>
  </body>
</html>
