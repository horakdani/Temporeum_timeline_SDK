<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline SDK — responsive</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #frame svg {
        display: block;
        width: 100%;
      }
      #status {
        padding: 0.4rem 0.6rem;
        font-size: 12px;
        color: #445;
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <div id="status"></div>

    <script type="module">
      import {
        createHitTester,
        createInputMachine,
        createNavigator,
        createTimeScale,
        densityMetrics,
        fitDensity,
        projectRect,
        renderTimeline,
        resolveDensity,
        resolveDetailSurface,
        resolveOrientation,
      } from "/core/index.mjs";
      import { attachInput, mountScene, observeSize, openDetail } from "/core/dom.mjs";

      // This page decides NOTHING. Which orientation, which density and which
      // detail surface a width means is for the core to say; the page measures,
      // draws and wires things up. A breakpoint of its own here would be exactly
      // the second number that once caused a touchAction bug.

      const DAY = 86_400_000;
      const START = Date.UTC(2026, 0, 1);
      // Four-day items over sixty days: at 1440 px an item is ~96 px, at 768
      // ~51 px, vertically at 520 px ~35 px — three different levels.
      const items = [
        { id: "a", start: START + 2 * DAY, end: START + 6 * DAY, label: "Planning", laneId: "l1" },
        { id: "b", start: START + 4 * DAY, end: START + 8 * DAY, label: "Build", laneId: "l1" },
        { id: "c", start: START + 14 * DAY, end: START + 18 * DAY, label: "Testing", laneId: "l1" },
        { id: "d", start: START + 24 * DAY, end: START + 28 * DAY, label: "Handover", laneId: "l2" },
        { id: "e", start: START + 34 * DAY, end: START + 38 * DAY, label: "Rollout", laneId: "l2" },
        { id: "f", start: START + 46 * DAY, end: START + 50 * DAY, label: "Measurement", laneId: "l2" },
        // It reaches the right edge of the range: a popover centred on it would
        // stick out of the screen here. (Its label is read by the e2e spec.)
        { id: "g", start: START + 56 * DAY, end: START + 60 * DAY, label: "Wrap-up", laneId: "l1" },
        // A true moment: its drawn length is the level's minimum, 2 px.
        { id: "moment", start: START + 41 * DAY, label: "Milestone", laneId: "l1" },
      ];
      const lanes = [
        { id: "l1", label: "Work" },
        { id: "l2", label: "Delivery" },
      ];
      const domain = [START, START + 60 * DAY];

      const params = new URLSearchParams(location.search);
      const settings = {
        orientation: params.get("orientation") ?? "auto",
        density: params.get("density") ?? "auto",
        detailSurface: params.get("detail") ?? "auto",
      };
      // The container's height is the HOST's decision, not the library's:
      // horizontally a block of lanes, vertically a screen-high column.
      const heightFor = (orientation) => (orientation === "horizontal" ? 240 : 520);

      const frame = document.querySelector("#frame");

      const mount = mountScene(frame);
      const status = document.querySelector("#status");

      let width = 0;
      let orientation;
      let density;
      let fit;
      let tester;
      let lastResult;
      let detail;
      let detailFor;
      let draws = 0;
      let lastTap = null;
      const changes = [];

      const machine = createInputMachine({
        domain,
        mainSize: 1,
        crossSize: 1,
        orientation: "horizontal",
        editing: { enabled: false },
      });

      function closeDetail() {
        detail?.close();
      }

      /** An item's box in VIEWPORT coordinates, the popover's anchor. */
      function clientBoxOf(id) {
        const placed = lastResult?.layout.items.find((candidate) => candidate.item.id === id);
        if (placed === undefined) {
          return undefined;
        }
        const metrics = densityMetrics(density, orientation);
        const scale = createTimeScale(domain, lastResult.viewport.mainSize);
        const from = scale.toMain(placed.span.start);
        const to = scale.toMain(placed.span.end);
        const box = projectRect(
          {
            main: from,
            mainSize: Math.max(to - from, metrics.minItemMainSize),
            cross: metrics.axisSize + placed.cross,
            crossSize: placed.crossSize,
          },
          orientation,
        );
        const origin = frame.getBoundingClientRect();
        return { x: origin.left + box.x, y: origin.top + box.y, width: box.width, height: box.height };
      }

      function showDetail(hit, pointerType) {
        const choice = resolveDetailSurface(settings.detailSurface, {
          pointerType,
          density,
          width,
        });
        if (detail !== undefined && detailFor === hit.item.id && detail.surface === choice.surface) {
          return choice;
        }
        closeDetail();
        const from = new Date(hit.span.start).toISOString().slice(0, 10);
        detail = openDetail(frame, {
          surface: choice.surface,
          content: `${hit.item.label} — ${from}`,
          label: `${hit.item.label} details`,
          closeLabel: "Dismiss",
          anchor: clientBoxOf(hit.item.id),
          onClose: () => {
            detail = undefined;
            detailFor = undefined;
            publish();
          },
        });
        detail.element.setAttribute("data-tl-item", hit.item.id);
        detail.element.setAttribute("data-tl-trigger", choice.trigger);
        detailFor = hit.item.id;
        publish();
        return choice;
      }

      let contentCross = 0;

      function draw() {
        if (width <= 0) {
          return;
        }
        const height = heightFor(orientation);
        const result = renderTimeline({
          items,
          lanes,
          domain: machine.domain,
          width,
          height,
          orientation,
          density,
          instanceId: "responsive",
          crossOffset: machine.crossOffset,
          focusedId: machine.focusedId,
          locale: "en-GB",
          ariaLabel: "Project timeline",
        });
        lastResult = result;
        draws += 1;
        // How far the lanes reach across: what lets the keys (and a drag)
        // scroll a lane cut off at the edge into view, at 320 px too.
        if (result.contentCrossSize !== contentCross) {
          contentCross = result.contentCrossSize;
          machine.resize({ contentCrossSize: contentCross });
        }
        // The patcher keeps the nodes and writes only what changed. An
        // innerHTML would throw them away and rebuild them on every draw.
        mount.update(result.scene);
        frame.querySelector("svg").setAttribute("data-testid", "timeline");
        const metrics = densityMetrics(density, orientation);
        const built = createHitTester({
          layout: result.layout,
          scale: createTimeScale(machine.domain, result.viewport.mainSize),
          crossInset: metrics.axisSize,
          crossOffset: machine.crossOffset,
          minItemMainSize: metrics.minItemMainSize,
          density,
        });
        tester = built;
        machine.setKeyboard({ navigator: createNavigator(result.layout, { crossInset: metrics.axisSize }) });
        publish();
      }

      /** The core's decisions from one measurement. The page only applies them. */
      function respond(size) {
        width = size.width;
        const nextOrientation = resolveOrientation(settings.orientation, width, {
          ...(orientation === undefined ? {} : { previous: orientation }),
        });
        const height = heightFor(nextOrientation);
        fit = fitDensity({
          items,
          lanes,
          domain: machine.domain,
          width,
          height,
          orientation: nextOrientation,
          ...(density === undefined || nextOrientation !== orientation ? {} : { previous: density }),
        });
        const nextDensity = resolveDensity(settings.density, fit);
        if (nextOrientation !== orientation || nextDensity !== density) {
          changes.push(`${String(width)}:${nextOrientation}:${nextDensity}`);
          // In a different projection the open detail points to the wrong place.
          closeDetail();
        }
        orientation = nextOrientation;
        density = nextDensity;
        machine.setOrientation(orientation);
        machine.resize(
          orientation === "horizontal"
            ? { mainSize: width, crossSize: height }
            : { mainSize: height, crossSize: width },
        );
        draw();
      }

      function publish() {
        status.textContent = `${String(width)} px · ${orientation} · ${density}`;
        window.tl = {
          width,
          orientation,
          density,
          fit,
          draws,
          changes,
          lastTap,
          focusedId: machine.focusedId,
          detail:
            detail === undefined
              ? null
              : { surface: detail.surface, item: detailFor, trigger: detail.element.dataset.tlTrigger },
          clientBoxOf,
        };
      }

      attachInput(frame, {
        machine,
        onEffects(effects) {
          let moved = false;
          let refocused = false;
          for (const effect of effects) {
            if (effect.type === "viewport") {
              moved = true;
            } else if (effect.type === "focus") {
              refocused = true;
            } else if (effect.type === "activate") {
              // Enter is the twin of a tap, Esc of an empty one: the same
              // detail surface, the keyboard counting as a precise pointer.
              const hit = effect.id === null ? undefined : tester?.lookup(effect.id);
              if (hit === undefined) {
                closeDetail();
              } else {
                showDetail(hit, "mouse");
              }
            } else if (effect.type === "tap" && effect.tapCount === 1 && effect.pointerCount === 1) {
              lastTap = { main: effect.main, cross: effect.cross, pointerType: effect.pointerType };
              // The tap's pointer type goes to the hit table too: a finger
              // gets 12 px, a mouse 4.
              const hit = tester?.hitTest({ main: effect.main, cross: effect.cross }, effect.pointerType);
              if (hit === undefined) {
                closeDetail();
              } else {
                showDetail(hit, effect.pointerType);
              }
            }
          }
          if (moved) {
            // Density also comes from pixels per unit of time: after a zoom
            // the same box can mean a different level.
            respond({ width });
          } else if (refocused) {
            draw();
          }
          // A tap that hits nothing is state too: from it the test knows the
          // click arrived and simply reached nothing.
          publish();
        },
      });

      // Hover exists only where the core says so: with a mouse, at a roomy
      // level, with a popover. For a finger this listener never opens anything.
      frame.addEventListener("pointermove", (event) => {
        if (event.pointerType !== "mouse" || machine.phase !== "idle" || tester === undefined) {
          return;
        }
        const choice = resolveDetailSurface(settings.detailSurface, {
          pointerType: "mouse",
          density,
          width,
        });
        if (choice.trigger !== "hover") {
          return;
        }
        const box = frame.getBoundingClientRect();
        const x = event.clientX - box.left;
        const y = event.clientY - box.top;
        const point = orientation === "horizontal" ? { main: x, cross: y } : { main: y, cross: x };
        const hit = tester.hitTest(point, "mouse");
        if (hit === undefined) {
          if (detail?.surface === "popover") {
            closeDetail();
          }
          return;
        }
        showDetail(hit, "mouse");
      });

      publish();
      // The decision lives on the CONTAINER's size, through a ResizeObserver —
      // not on the size at load time, and not on the window.
      observeSize(frame, respond);
    </script>
  </body>
</html>
