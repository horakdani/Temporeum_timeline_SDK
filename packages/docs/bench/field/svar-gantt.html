<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
      #frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }
      /* The Gantt fills its parent; the theme's wrapper has to pass the box's height on. */
      #frame > div, .wx-willow-theme { height: 100%; }
    </style>
    <title>Field benchmark — SVAR React Gantt, Gantt</title>
    <link rel="stylesheet" href="/nm/@svar-ui/react-gantt/dist-full/index.css" />
    <script src="/work/svar.js"></script>
  </head>
  <body>
    <div id="frame" data-bench-field="svar:gantt"></div>
    <script type="module">
      import { ganttData, installBench, scrollWindow } from "./kit.js";
      const { React, createRoot, Gantt, Willow } = window.BenchSvar;
      const n = Number(new URLSearchParams(location.search).get("n") ?? 500);
      const { tasks, links } = ganttData(n);
      const frame = document.querySelector("#frame");
      let edits = 0;
      // Its defaults (editable, day scale) with wheel zoom on, in its own theme; the chart alone, as the
      // other two draw it, and cells that put about thirty days in the box, as the other two show.
      createRoot(frame).render(
        React.createElement(
          Willow,
          null,
          React.createElement(Gantt, {
            tasks: tasks.map((task) => ({ id: task.id, text: task.label, start: new Date(task.start), end: new Date(task.end), progress: task.progress * 100, type: "task" })),
            links: links.map((link) => ({ id: link.id, source: link.from, target: link.to, type: "e2s" })),
            zoom: true,
            columns: false,
            cellWidth: 48,
            init: (api) => {
              api.on("update-task", () => (edits += 1));
            },
          }),
        ),
      );
      const scroller = () => frame.querySelector(".wx-chart") ?? frame.querySelector("[class*=chart]");
      const view = scrollWindow(scroller);
      installBench({
        library: "svar",
        workload: "gantt",
        n,
        frame,
        itemSelector: ".wx-bar",
        offsetPx: () => view.offsetPx(),
        zoomFactor: () => view.zoomFactor(),
        pan: () => {
          view.mark();
          const r = scroller().getBoundingClientRect();
          const box = frame.getBoundingClientRect();
          return { mode: "wheel-x", x: (r.left + r.right) / 2 - box.left, y: (r.top + r.bottom) / 2 - box.top };
        },
        // One mouse notch; SVAR limits how fast a zoom runs, and the harness records how far it got.
        zoom: { supported: true, stepIn: 100, stepOut: 100 },
        edits: () => edits,
      });
    </script>
  </body>
</html>
