<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
      #frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }
    </style>
    <title>Field benchmark — vis-timeline, timeline</title>
    <script src="/vis/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
  </head>
  <body>
    <div id="frame" data-bench-field="vis-timeline:timeline"></div>
    <script type="module">
      import { installBench, timelineData, timeWindow } from "./kit.js";
      const n = Number(new URLSearchParams(location.search).get("n") ?? 1000);
      const { items, groups, view } = timelineData(n);
      const frame = document.querySelector("#frame");
      let edits = 0;
      // The standalone build, its defaults, editing on; the now line off, because the other two draw none.
      const timeline = new vis.Timeline(
        frame,
        new vis.DataSet(items.map((item) => ({ id: item.id, start: item.start, end: item.end, content: item.label, group: item.group }))),
        new vis.DataSet(groups.map((group) => ({ id: group.id, content: group.label }))),
        { start: view[0], end: view[1], height: "900px", editable: true, showCurrentTime: false, onMove: (item, callback) => { edits += 1; callback(item); } },
      );
      const time = timeWindow(() => {
        const w = timeline.getWindow();
        return { start: w.start.valueOf(), end: w.end.valueOf() };
      });
      time.mark();
      installBench({
        library: "vis-timeline",
        workload: "timeline",
        n,
        frame,
        itemSelector: ".vis-item",
        ...time,
        // The axis band: a drag there pans and edits nothing.
        pan() {
          const box = frame.getBoundingClientRect();
          const axis = frame.querySelector(".vis-time-axis.vis-foreground") ?? frame.querySelector(".vis-time-axis");
          const r = axis?.getBoundingClientRect();
          return { mode: "drag", x: 1100, y: r === undefined ? 20 : r.top + r.height / 2 - box.top };
        },
        // vis zooms on any wheel: deltaY 100 is one 1.2x step (wheelDelta 120 / zoomFriction 5).
        zoom: { supported: true, stepIn: 100, stepOut: 100 },
        edits: () => edits,
      });
    </script>
  </body>
</html>
