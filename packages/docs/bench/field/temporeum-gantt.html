<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
      #frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }
    </style>
    <title>Field benchmark — Temporeum, Gantt</title>
    <script type="importmap">
      {
        "imports": {
          "@temporeum/timeline-element": "/element/index.mjs",
          "@temporeum/timeline-element/gantt": "/element/gantt.mjs",
          "@temporeum/timeline-core": "/core/index.mjs",
          "@temporeum/timeline-core/dom": "/core/dom.mjs",
          "@temporeum/timeline-core/groups": "/core/groups.mjs",
          "@temporeum/timeline-core/items": "/core/items.mjs",
          "@temporeum/timeline-core/gantt": "/core/gantt.mjs",
          "@temporeum/timeline-core/resources": "/core/resources.mjs",
          "@temporeum/timeline-core/tools": "/core/tools.mjs",
          "@temporeum/timeline-core/export": "/core/export.mjs",
          "@temporeum/timeline-core/intl": "/core/intl.mjs",
          "@temporeum/timeline-core/live": "/core/live.mjs",
          "@temporeum/timeline-core/words": "/core/words.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="frame" data-bench-field="temporeum:gantt"></div>
    <script type="module">
      import { createTimeline, registerPlugin } from "@temporeum/timeline-element";
      import { ganttPlugin } from "@temporeum/timeline-element/gantt";
      import { ganttData, installBench, timeWindow } from "./kit.js";
      registerPlugin(ganttPlugin);
      const n = Number(new URLSearchParams(location.search).get("n") ?? 500);
      const { tasks, links } = ganttData(n);
      // About thirty days in the box.
      const view = [Date.UTC(2026, 0, 1), Date.UTC(2026, 0, 31)];
      const frame = document.querySelector("#frame");
      let edits = 0;
      const timeline = createTimeline(frame, {
        items: tasks.map((task) => ({ id: task.id, start: task.start, end: task.end, label: task.label, progress: task.progress, laneId: task.id })),
        lanes: tasks.map((task) => ({ id: task.id, label: task.label })),
        gantt: { dependencies: links.map((link) => ({ from: link.from, to: link.to })) },
        domain: view,
        height: 900,
        orientation: "horizontal",
        editing: { enabled: true },
        ariaLabel: "Gantt benchmark",
      });
      timeline.on("itemMoved", () => (edits += 1));
      timeline.on("itemResized", () => (edits += 1));
      const time = timeWindow(() => {
        const [start, end] = timeline.getSnapshot().domain;
        return { start, end };
      });
      time.mark();
      installBench({
        library: "temporeum",
        workload: "gantt",
        n,
        frame,
        itemSelector: "rect.tl-item",
        ...time,
        // A plain wheel along time pans, as it scrolls the other two charts.
        pan: () => ({ mode: "wheel-x", x: 720, y: 450 }),
        zoom: { supported: true, stepIn: Math.log(1.2) / 0.004, stepOut: Math.log(1.2) / 0.004 },
        edits: () => edits,
      });
    </script>
  </body>
</html>
