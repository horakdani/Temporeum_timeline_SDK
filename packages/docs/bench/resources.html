<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resource view benchmark — @temporeum/timeline-element</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #frame {
        position: relative;
        width: 1440px;
        height: 900px;
        overflow: hidden;
      }
    </style>
    <!-- The public path, as in temporeum.html: the built dist files by package name. -->
    <script type="importmap">
      {
        "imports": {
          "@temporeum/timeline-element": "/element/index.mjs",
          "@temporeum/timeline-element/resources": "/element/resources.mjs",
          "@temporeum/timeline-core": "/core/index.mjs",
          "@temporeum/timeline-core/dom": "/core/dom.mjs",
          "@temporeum/timeline-core/groups": "/core/groups.mjs",
          "@temporeum/timeline-core/items": "/core/items.mjs",
          "@temporeum/timeline-core/gantt": "/core/gantt.mjs",
          "@temporeum/timeline-core/resources": "/core/resources.mjs",
          "@temporeum/timeline-core/tools": "/core/tools.mjs",
          "@temporeum/timeline-core/export": "/core/export.mjs",
          "@temporeum/timeline-core/intl": "/core/intl.mjs",
          "@temporeum/timeline-core/live": "/core/live.mjs",
          "@temporeum/timeline-core/words": "/core/words.mjs",
          "@temporeum/timeline-core/calendar": "/core/calendar.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="frame" data-bench-resources="temporeum"></div>

    <script type="module">
      /*
       * G-PERF-RESOURCES' page (scripts/sdk_bench_resources.mjs):
       *
       *   window.benchResources = {
       *     marker, resources, assignments, cull, burn,
       *     ready,                  Promise — first complete render, two quiet rAFs after
       *     frames.start() / .stop(),  rAF frame deltas (ms)
       *     getRange(),             { start, end } of the view
       *     axisY(),                a y on the axis band, where a drag pans
       *     counts(),               { bars, overloads, items } in the document
       *     edits(),                item edits seen (a pan must make none)
       *     burned(),               frames that did the `?burn` work
       *   }
       *
       * `?cull=0` draws every resource's load, over all time, on every frame
       * (a note: at this size the cull is not what keeps it fast).
       * `?burn=N` is the sensitivity control: every frame during a gesture
       * does N ms more work — the measurement must see it.
       */
      import { createTimeline, registerPlugin } from "@temporeum/timeline-element";
      import { resourcesPlugin } from "@temporeum/timeline-element/resources";
      registerPlugin(resourcesPlugin);

      const params = new URLSearchParams(location.search);
      const cull = params.get("cull") !== "0";
      const burn = Number(params.get("burn") ?? 0);
      let burned = 0;
      const RESOURCES = 500;
      const PER_RESOURCE = 20;
      const DAY = 86_400_000;
      const START = Date.UTC(2026, 0, 1);

      // 500 people with 20 assignments each: 2-to-6-day pieces of work one
      // after another, every third one starting before the last has ended —
      // so every person is overbooked now and then. A person in ten has two
      // of capacity, a piece in four takes half of one.
      const resources = [];
      const items = [];
      for (let person = 0; person < RESOURCES; person += 1) {
        resources.push({ id: `p${person}`, label: `Person ${person}`, ...(person % 10 === 0 ? { capacity: 2 } : {}) });
        let at = START + (person % 40) * DAY;
        for (let step = 0; step < PER_RESOURCE; step += 1) {
          const length = (2 + ((person * 7 + step * 3) % 5)) * DAY;
          const start = step % 3 === 2 ? at - 2 * DAY : at;
          items.push({ id: `a${person}-${step}`, start, end: start + length, laneId: `p${person}`, label: `Work ${person}.${step}`, data: { units: (person + step) % 4 === 0 ? 0.5 : 1 } });
          at = start + length + ((person + step) % 3) * DAY;
        }
      }
      const view = [START + 30 * DAY, START + 90 * DAY];

      const frame = document.querySelector("#frame");
      let edits = 0;
      const recorder = { times: [], on: false };
      const record = (time) => {
        if (!recorder.on) return;
        recorder.times.push(time);
        requestAnimationFrame(record);
      };
      const frames = {
        start() {
          recorder.times = [];
          recorder.on = true;
          requestAnimationFrame(record);
        },
        stop() {
          recorder.on = false;
          const t = recorder.times;
          return t.slice(1).map((time, index) => time - t[index]);
        },
      };
      let mutated = false;
      new MutationObserver(() => {
        mutated = true;
      }).observe(frame, { subtree: true, childList: true, attributes: true, characterData: true });
      const ready = new Promise((resolve) => {
        let quiet = 0;
        const check = () => {
          const present = frame.querySelector("rect.tl-item") !== null && frame.querySelector("path.tl-load") !== null;
          if (present && !mutated) quiet += 1;
          else quiet = 0;
          mutated = false;
          if (quiet >= 2) resolve(performance.now());
          else requestAnimationFrame(check);
        };
        requestAnimationFrame(check);
      });

      const timeline = createTimeline(frame, {
        items,
        resources,
        resourceOptions: { cull, unitsOf: (item) => item.data?.units ?? 1 },
        domain: view,
        height: 900,
        orientation: "horizontal",
        editing: { enabled: true, crossLane: true },
        ariaLabel: "Resource view benchmark",
      });
      if (burn > 0) {
        // Every frame during a gesture — a drag from down to up, a wheel
        // notch and the 100 ms after it — does N ms more, by the wall clock:
        // a drawing that costs that much per frame. (In a space a pan redraws
        // nothing, so a cost tied to the timeline's own frames would never
        // meet a pan; and one per input event would fall between the events.)
        let dragging = false;
        let wheelUntil = 0;
        const options = { capture: true, passive: true };
        frame.addEventListener("pointerdown", () => {
          dragging = true;
        }, options);
        window.addEventListener("pointerup", () => {
          dragging = false;
        }, options);
        frame.addEventListener("wheel", () => {
          wheelUntil = performance.now() + 100;
        }, options);
        const tick = (time) => {
          if (dragging || time < wheelUntil) {
            burned += 1;
            const until = performance.now() + burn;
            while (performance.now() < until) {
              // busy
            }
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
      timeline.on("itemMoved", () => {
        edits += 1;
      });
      timeline.on("itemResized", () => {
        edits += 1;
      });

      const bars = (selector) => [...frame.querySelectorAll(selector)].reduce((sum, path) => sum + (path.getAttribute("d").match(/Z/g) ?? []).length, 0);
      window.benchResources = {
        marker: "temporeum-bench-resources",
        resources: resources.length,
        assignments: items.length,
        cull,
        burn,
        ready,
        frames,
        getRange() {
          const domain = timeline.getSnapshot().domain;
          return { start: domain[0], end: domain[1] };
        },
        // The middle of the tick labels, as in temporeum.html: a drag there pans and edits nothing.
        axisY() {
          const box = frame.getBoundingClientRect();
          const labels = [...frame.querySelectorAll("text.tl-tick-label")].map((node) => node.getBoundingClientRect());
          if (labels.length === 0) return null;
          return (Math.min(...labels.map((r) => r.top)) + Math.max(...labels.map((r) => r.bottom))) / 2 - box.top;
        },
        counts() {
          return { bars: bars("path.tl-load"), overloads: bars("path.tl-overload"), items: frame.querySelectorAll("[data-tl-id]").length };
        },
        edits() {
          return edits;
        },
        burned() {
          return burned;
        },
      };
    </script>
  </body>
</html>
