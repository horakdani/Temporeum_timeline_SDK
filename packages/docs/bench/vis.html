<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparison benchmark — vis-timeline</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      /* The measured container: the viewport's 1440 x 900, the same box as temporeum.html. */
      #frame {
        position: relative;
        width: 1440px;
        height: 900px;
        overflow: hidden;
      }
    </style>
    <!--
      vis-timeline's standalone UMD build: vis-data, moment, hammer and the
      stylesheet are inside it, so this one file is everything the page
      loads for the library. Served from packages/docs/.bench-work, which
      the comparison script installs outside the workspace.
    -->
    <script src="/vis/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
  </head>
  <body>
    <div id="frame" data-bench-compare="vis-timeline"></div>

    <script>
      /*
       * Same contract as temporeum.html (see the comment there). The dataset
       * generator, the frame recorder and the ready rule are copied verbatim.
       */
      (() => {
        const params = new URLSearchParams(location.search);
        const n = Number(params.get("n") ?? 1000);

        const DAY = 86_400_000;
        const START = Date.UTC(2026, 0, 1);
        const STREAMS = 60;
        const PERIOD = 10 * DAY;
        const LENGTH = 8 * DAY;
        const items = [];
        for (let index = 0; index < n; index += 1) {
          const stream = index % STREAMS;
          const round = Math.floor(index / STREAMS);
          const start = START + round * PERIOD + (stream * PERIOD) / STREAMS;
          // vis calls the label `content`; with an `end` the item is a range.
          items.push({ id: `e${index}`, start, end: start + LENGTH, content: `Item ${index}` });
        }
        const total = items[items.length - 1].end - START;
        const view = [START + total * 0.2, START + total * 0.4];

        const frame = document.querySelector("#frame");
        let edits = 0;

        const recorder = { times: [], on: false };
        const record = (time) => {
          if (!recorder.on) return;
          recorder.times.push(time);
          requestAnimationFrame(record);
        };
        const frames = {
          start() {
            recorder.times = [];
            recorder.on = true;
            requestAnimationFrame(record);
          },
          stop() {
            recorder.on = false;
            const t = recorder.times;
            return t.slice(1).map((time, index) => time - t[index]);
          },
        };

        const itemSelector = ".vis-item";
        let mutated = false;
        new MutationObserver(() => {
          mutated = true;
        }).observe(frame, { subtree: true, childList: true, attributes: true, characterData: true });
        const ready = new Promise((resolve) => {
          let quiet = 0;
          let firstItemsMs = null;
          const check = () => {
            // Present AND shown: vis keeps its root visibility:hidden until its
            // initial range settles, and a hidden drawing is not a render.
            const first = frame.querySelector(itemSelector);
            if (first !== null && firstItemsMs === null) firstItemsMs = performance.now();
            const present = first !== null && first.checkVisibility({ visibilityProperty: true, opacityProperty: true });
            if (present && !mutated) quiet += 1;
            else quiet = 0;
            mutated = false;
            if (quiet >= 2) resolve({ readyMs: performance.now(), firstItemsMs });
            else requestAnimationFrame(check);
          };
          requestAnimationFrame(check);
        });

        // The library with its defaults, plus editing (what users ship) and
        // the now line off, because temporeum draws none by default.
        const data = new vis.DataSet(items);
        data.on("update", () => {
          edits += 1;
        });
        const timeline = new vis.Timeline(frame, data, {
          start: view[0],
          end: view[1],
          height: "900px",
          width: "100%",
          editable: true,
          showCurrentTime: false,
        });

        function counts() {
          const box = frame.getBoundingClientRect();
          const inside = (r) => r.right > box.left && r.left < box.right && r.bottom > box.top && r.top < box.bottom;
          const nodes = frame.querySelectorAll(itemSelector);
          let visibleItems = 0;
          for (const node of nodes) if (inside(node.getBoundingClientRect())) visibleItems += 1;
          return {
            itemNodes: nodes.length,
            labelNodes: frame.querySelectorAll(".vis-item-content").length,
            visibleItems,
            elements: frame.getElementsByTagName("*").length,
          };
        }

        /** The middle of the axis band (vis puts it at the bottom). A drag there pans, never edits. */
        function axisY() {
          const box = frame.getBoundingClientRect();
          const axis = frame.querySelector(".vis-time-axis.vis-foreground");
          if (axis === null) return null;
          const r = axis.getBoundingClientRect();
          return (r.top + r.bottom) / 2 - box.top;
        }

        function getRange() {
          const range = timeline.getWindow();
          return { start: range.start.valueOf(), end: range.end.valueOf() };
        }

        window.benchCompare = {
          marker: "temporeum-bench-compare",
          library: "vis-timeline",
          n,
          ready,
          frames,
          getRange,
          counts,
          axisY,
          edits: () => edits,
          view,
          total,
        };
      })();
    </script>
  </body>
</html>
