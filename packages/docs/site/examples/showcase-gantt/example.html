<style>
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #d5d9de; }
  .bar button { padding: 3px 10px; border: 1px solid #8a939d; border-radius: 4px; background: #fff; }
  .bar button[aria-pressed="true"] { background: #1b1f24; color: #fff; }
  .bar button:disabled { opacity: 0.45; }
  .bar output { margin-left: auto; font-size: 12px; color: #444c55; }
  .plan { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 470px; }
  .plan.narrow { grid-template-columns: minmax(0, 1fr); }
  #timeline { height: 470px; }
  #load { height: 230px; border-top: 1px solid #d5d9de; }
  /* The whole explanation, never a box that scrolls: a scrolling region would need a keyboard stop of its own. */
  #log { max-height: none; }
  #timeline .critical { --tl-item-fill: #f4a097; --tl-item-stroke: #b3261e; stroke-width: 1.5px; }
</style>
<div class="bar">
  <button type="button" id="schedule">Reschedule</button>
  <button type="button" id="undo" disabled>Undo</button>
  <button type="button" id="redo" disabled>Redo</button>
  <button type="button" id="team" aria-pressed="false" aria-controls="load">Team load</button>
  <output id="status" aria-live="polite"></output>
</div>
<div class="plan" id="plan">
  <div id="grid"></div>
  <div id="timeline"></div>
</div>
<div id="load" hidden></div>
<p class="log" id="log">Drag a task later, or focus one and press Alt + →. The bars outlined in red are the critical path: a day lost there is a day lost at launch. Reschedule pushes the successors back in order; Ctrl + Z undoes.</p>
